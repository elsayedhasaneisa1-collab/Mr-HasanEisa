<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>امتحانات أستاذ حسن عيسى</title><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap">
<header><div><b>🎓 امتحانات أستاذ حسن عيسى</b><small>اللغة العربية • 6 ابتدائي</small></div><button id="teacherBtn">👨‍🏫 الأستاذ</button></header>
<section id="student"><div id="start" class="card"><div class="big">📚</div><h1 id="title">جاري تحميل الامتحان...</h1><p id="info"></p><label>اسم الطالب<input id="name" maxlength="80" placeholder="اكتب اسمك هنا"></label><button id="startBtn" class="main" disabled>🚀 ابدأ الامتحان</button><p id="msg"></p></div>
<div id="exam" class="card hide"><div class="bar"><div><h2 id="liveTitle"></h2><span id="student"></span></div><strong id="timer">00:00</strong></div><div class="progress"><i id="progress"></i></div><div id="question"></div><div class="actions"><button id="prev">السابق</button><button id="next" class="main">التالي</button></div><button id="submit" class="submit hide">✅ تسليم الامتحان</button></div>
<div id="result" class="card hide"><div class="big">🏆</div><h1>مبروك! خلصت الامتحان</h1><div id="score"></div></div></section>
<section id="teacherPage" class="hide"><div class="card"><h1>👨‍🏫 إنشاء امتحان</h1><label>اسم الامتحان<input id="tTitle" value="امتحان اللغة العربية"></label><label>المدة بالدقائق<input id="tMinutes" type="number" min="1" max="240" value="30"></label><div id="editors"></div><button id="add" >➕ إضافة سؤال</button><button id="create" class="main">🔗 إنشاء رابط الامتحان</button><input id="link" readonly placeholder="سيظهر رابط الامتحان هنا"><button id="copy">📋 نسخ الرابط</button><p id="tmsg"></p></div><div class="card"><h2>📊 النتائج</h2><button id="refresh">تحديث النتائج</button><div id="results"></div></div><button id="back">⬅️ رجوع</button></section>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
